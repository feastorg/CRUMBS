name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Every job here only reads the repo and restores caches; nothing writes to
# GitHub. Keep the token read-only (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-only-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CRUMBS (core only)
        run: |
          cmake -S . -B build-core-only \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRUMBS_ENABLE_TESTS=ON \
            -DCRUMBS_BUILD_EXAMPLES=OFF \
            -DCRUMBS_ENABLE_LINUX_HAL=OFF

      - name: Build CRUMBS (core only)
        run: cmake --build build-core-only --parallel

      - name: Run CRUMBS tests (core only)
        run: ctest --test-dir build-core-only --output-on-failure

      - name: Install CRUMBS (core only)
        run: cmake --install build-core-only --prefix "${{ github.workspace }}/install-core-only"

      - name: Verify core-only install boundary
        run: |
          test -f "${{ github.workspace }}/install-core-only/include/crumbs/crumbs.h"
          test ! -e "${{ github.workspace }}/install-core-only/include/crumbs/crumbs_linux.h"

      - name: Build installed core package consumer
        run: |
          cmake -S tests/cmake/core_only_consumer -B build-smoke-core-only \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-core-only"
          cmake --build build-smoke-core-only --parallel
          ./build-smoke-core-only/core_only_consumer

  build-and-test:
    runs-on: ubuntu-latest
    env:
      LINUX_WIRE_VERSION: "0.1.1"
      LINUX_WIRE_SHA256: "ad15ff7742e4b4108014096386ee01e2f89a9f74c77b2e42f4591c5371479bda"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config libi2c-dev libudev-dev python3-pip

      # ---------------------------------------------------------------------
      # Build & install linux-wire
      # ---------------------------------------------------------------------
      - name: Cache linux-wire
        id: cache-linux-wire
        uses: actions/cache@v6
        with:
          path: third_party/linux-wire/install
          key: linux-wire-${{ runner.os }}-${{ env.LINUX_WIRE_VERSION }}-${{ env.LINUX_WIRE_SHA256 }}

      - name: Install linux-wire from release
        if: steps.cache-linux-wire.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party/linux-wire/install
          curl -fsSL "https://github.com/feastorg/linux-wire/releases/download/v${LINUX_WIRE_VERSION}/linux-wire-${LINUX_WIRE_VERSION}-linux-x86_64.tar.gz" \
            -o linux-wire.tar.gz
          echo "${LINUX_WIRE_SHA256}  linux-wire.tar.gz" | sha256sum -c -
          tar -xzf linux-wire.tar.gz -C third_party/linux-wire/install

      # ---------------------------------------------------------------------
      # Build & test CRUMBS
      # ---------------------------------------------------------------------
      - name: Configure CRUMBS (with Linux HAL)
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/third_party/linux-wire/install
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRUMBS_ENABLE_TESTS=ON \
            -DCRUMBS_ENABLE_LINUX_HAL=ON \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"

      - name: Build CRUMBS
        run: cmake --build build --parallel

      - name: Run CRUMBS tests
        run: ctest --test-dir build --output-on-failure

      # ---------------------------------------------------------------------
      # Out-of-tree example builds (Linux)
      # ---------------------------------------------------------------------
      - name: Install CRUMBS locally
        run: cmake --install build --prefix ${{ github.workspace }}/install

      - name: Build Linux simple_controller (core_usage)
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/third_party/linux-wire/install:${{ github.workspace }}/install
        run: |
          cmake -S examples/core_usage/linux/simple_controller -B build-simple-controller \
            -DCRUMBS_BUILD_IN_TREE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          cmake --build build-simple-controller --parallel

      # The runner has no I2C bus, so the observable is which device the
      # program tries to open. "scan" must select scan mode on the default
      # bus, not be taken as a device path (#57).
      - name: Smoke-run Linux simple_controller argument parsing
        run: |
          ./build-simple-controller/crumbs_simple_linux_controller --help
          out=$(./build-simple-controller/crumbs_simple_linux_controller scan 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'for device /dev/i2c-1'

      - name: Build Linux mock_controller (handlers_usage)
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/third_party/linux-wire/install:${{ github.workspace }}/install
        run: |
          cmake -S examples/handlers_usage/linux/mock_controller -B build-mock-controller \
            -DCRUMBS_BUILD_IN_TREE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          cmake --build build-mock-controller --parallel

      - name: Build Linux controller_discovery (families_usage)
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/third_party/linux-wire/install:${{ github.workspace }}/install
        run: |
          cmake -S examples/families_usage/controller_discovery -B build-controller-discovery \
            -DCRUMBS_BUILD_IN_TREE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          cmake --build build-controller-discovery --parallel

      - name: Build Linux controller_manual (families_usage)
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/third_party/linux-wire/install:${{ github.workspace }}/install
        run: |
          cmake -S examples/families_usage/controller_manual -B build-controller-manual \
            -DCRUMBS_BUILD_IN_TREE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
          cmake --build build-controller-manual --parallel

  # ---------------------------------------------------------------------------
  # PlatformIO Builds
  # ---------------------------------------------------------------------------
  platformio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('examples/**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install -U pip
          python -m pip install -U platformio

      - name: Build simple_controller (core_usage)
        run: pio run -d examples/core_usage/platformio/simple_controller -e nanoatmega328new

      - name: Build simple_peripheral (core_usage)
        run: pio run -d examples/core_usage/platformio/simple_peripheral -e nanoatmega328new

      - name: Build mock_controller (handlers_usage)
        run: pio run -d examples/handlers_usage/platformio/mock_controller -e nanoatmega328new

      - name: Build mock_peripheral (handlers_usage)
        run: pio run -d examples/handlers_usage/platformio/mock_peripheral -e nanoatmega328new

      - name: Build calculator peripheral (families_usage)
        run: pio run -d examples/families_usage/lhwit_family/calculator -e nanoatmega328new

      - name: Build LED peripheral (families_usage)
        run: pio run -d examples/families_usage/lhwit_family/led -e nanoatmega328new

      - name: Build servo peripheral (families_usage)
        run: pio run -d examples/families_usage/lhwit_family/servo -e nanoatmega328new

      - name: Build display peripheral (families_usage)
        run: pio run -d examples/families_usage/lhwit_family/display -e nanoatmega328new

      # ESP32 build validation
      - name: Build simple_controller (core_usage, ESP32)
        run: pio run -d examples/core_usage/platformio/simple_controller -e esp32dev

      - name: Build simple_peripheral (core_usage, ESP32)
        run: pio run -d examples/core_usage/platformio/simple_peripheral -e esp32dev

      - name: Build mock_controller (handlers_usage, ESP32)
        run: pio run -d examples/handlers_usage/platformio/mock_controller -e esp32dev

      - name: Build mock_peripheral (handlers_usage, ESP32)
        run: pio run -d examples/handlers_usage/platformio/mock_peripheral -e esp32dev

      - name: Build calculator peripheral (families_usage, ESP32)
        run: pio run -d examples/families_usage/lhwit_family/calculator -e esp32dev

      - name: Build LED peripheral (families_usage, ESP32)
        run: pio run -d examples/families_usage/lhwit_family/led -e esp32dev

      - name: Build servo peripheral (families_usage, ESP32)
        run: pio run -d examples/families_usage/lhwit_family/servo -e esp32dev

      - name: Build display peripheral (families_usage, ESP32)
        run: pio run -d examples/families_usage/lhwit_family/display -e esp32dev

  # ---------------------------------------------------------------------------
  # Doc Check
  # ---------------------------------------------------------------------------
  doxygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y doxygen

      - name: Run doc-check script
        run: bash ./scripts/doccheck.sh

  # ─── Build configurations the default build never exercises ──────────────
  build-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            c_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
            link_flags: "-fsanitize=address,undefined"
          - name: no-handler-table
            c_flags: "-DCRUMBS_MAX_HANDLERS=0"
            link_flags: ""
    name: build-configs (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure (core only, ${{ matrix.name }})
        run: |
          cmake -S . -B build-${{ matrix.name }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCRUMBS_ENABLE_TESTS=ON \
            -DCRUMBS_BUILD_EXAMPLES=OFF \
            -DCRUMBS_ENABLE_LINUX_HAL=OFF \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.link_flags }}"

      - name: Build
        run: cmake --build build-${{ matrix.name }} --parallel

      # test_handlers and test_reply_handler exit with the CTest skip code when
      # the table is compiled out (Skipped, not Passed); test_set_reply compiles
      # out its two table-dependent subtests and runs the rest.
      - name: Test
        run: ctest --test-dir build-${{ matrix.name }} --output-on-failure

  # ─── Arduino-IDE sketches (no platformio.ini) ─────────────────────────────
  arduino-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EZO_DRIVER_TAG: v0.5.1
      EZO_DRIVER_SHA: e54bfc2bebdbed63aa997d907c9737747004e011
      SPARKFUN_BME280_TAG: v2.0.11
      SPARKFUN_BME280_SHA: 870c17da1f4c76561e14b8ffcc7cdffd63136e10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      # Third-party libraries the vendor sketch needs, pinned by tag and
      # checked against the expected commit, in the spirit of the linux-wire
      # checksum in build-and-test.
      - name: Fetch vendor libraries
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch "$EZO_DRIVER_TAG" \
            https://github.com/feastorg/ezo-driver third_party/ezo-driver
          test "$(git -C third_party/ezo-driver rev-parse HEAD)" = "$EZO_DRIVER_SHA"
          git -c advice.detachedHead=false clone --depth 1 --branch "$SPARKFUN_BME280_TAG" \
            https://github.com/sparkfun/SparkFun_BME280_Arduino_Library third_party/SparkFun_BME280
          test "$(git -C third_party/SparkFun_BME280 rev-parse HEAD)" = "$SPARKFUN_BME280_SHA"

      - name: Compile mixed_bus_controller (Nano)
        run: |
          arduino-cli compile --fqbn arduino:avr:nano --warnings more \
            --library "$PWD" \
            examples/core_usage/arduino/mixed_bus_controller

      - name: Compile mixed_bus_controller_vendor (Nano)
        run: |
          arduino-cli compile --fqbn arduino:avr:nano --warnings more \
            --library "$PWD" \
            --library "$PWD/third_party/ezo-driver" \
            --library "$PWD/third_party/SparkFun_BME280" \
            examples/core_usage/arduino/mixed_bus_controller_vendor

  # ─── CRC source is generated; the committed copy must match the generator ──
  crc-regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pycrc (version pinned to the banner in src/crc)
        run: python -m pip install pycrc==0.11.0

      - name: Regenerate CRC-8 sources
        run: python scripts/generate_crc8.py --no-stage

      - name: Diff generated sources against src/crc (ignoring the timestamp line)
        run: |
          rc=0
          for f in crc8_nibble.h crc8_nibble.c; do
            if ! diff -u \
                <(grep -v '^ \* Generated on ' "src/crc/$f") \
                <(grep -v '^ \* Generated on ' "dist/crc/c99/$f"); then
              echo "::error file=src/crc/$f::committed CRC source differs from generator output"
              rc=1
            fi
          done
          exit $rc

  # ─── Unified gate ─────────────────────────────────────────────────────────
  # Branch protection requires only: CI / ok
  ok:
    name: ok
    if: always()
    needs: [core-only-install, build-and-test, platformio, doxygen, crc-regen, build-configs, arduino-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo 'All checks passed or were skipped'
