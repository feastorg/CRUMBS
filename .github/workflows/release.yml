name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Release (linux-x86_64)
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      LINUX_WIRE_VERSION: "0.1.3"
      LINUX_WIRE_SHA256: "a7c3d1d8fcaf4f5aab50891bfc6ab13f3e3c204f0b62d22004d76afefef43e25"

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential jq

      - name: Check the tag names the version every package file carries
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          status=0
          check() {
            if [ "$2" != "${VERSION}" ]; then
              echo "::error file=$1::$1 carries version '$2'; tag ${GITHUB_REF_NAME} names ${VERSION}"
              status=1
            fi
          }
          check library.json "$(jq -r .version library.json)"
          check library.properties "$(sed -n 's/^version=//p' library.properties)"
          check pyproject.toml "$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          check CMakeLists.txt "$(awk '/^project\(CRUMBS/{p=1} p && $1=="VERSION"{print $2; exit}' CMakeLists.txt)"
          check src/crumbs_version.h "$(sed -n 's/^#define CRUMBS_VERSION_STRING "\(.*\)".*/\1/p' src/crumbs_version.h)"
          exit "${status}"

      - name: Install linux-wire from release
        run: |
          mkdir -p third_party/linux-wire/install
          curl -fsSL "https://github.com/feastorg/linux-wire/releases/download/v${LINUX_WIRE_VERSION}/linux-wire-${LINUX_WIRE_VERSION}-linux-x86_64.tar.gz" \
            -o linux-wire.tar.gz
          echo "${LINUX_WIRE_SHA256}  linux-wire.tar.gz" | sha256sum -c -
          tar -xzf linux-wire.tar.gz -C third_party/linux-wire/install

      - name: Configure CRUMBS (Linux HAL enabled)
        run: |
          cmake -S . -B build/release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRUMBS_ENABLE_TESTS=ON \
            -DCRUMBS_ENABLE_LINUX_HAL=ON \
            -DCRUMBS_BUILD_EXAMPLES=OFF \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/third_party/linux-wire/install"

      - name: Build
        run: cmake --build build/release --parallel

      - name: Test
        run: ctest --test-dir build/release --output-on-failure

      - name: Install to staging
        run: |
          cmake --install build/release \
            --prefix "${{ github.workspace }}/staging"

      - name: Package binary artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="crumbs-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "${ARTIFACT}" -C "${{ github.workspace }}/staging" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Test the Python binding in the locked environment
        run: |
          uv sync --locked
          uv run pytest

      - name: Build the Python sdist and universal wheel
        run: |
          uv build
          ls -l "dist/crumbs_i2c-${{ steps.version.outputs.version }}-py3-none-any.whl" \
            "dist/crumbs_i2c-${{ steps.version.outputs.version }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

      - name: Package source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="crumbs-${VERSION}/" \
            -o "crumbs-${VERSION}-source.tar.gz" \
            HEAD

      - name: Generate checksums
        run: |
          sha256sum crumbs-*.tar.gz > SHA256SUMS
          (cd dist && sha256sum -- *) >> SHA256SUMS

      - name: Generate manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${{ steps.package.outputs.artifact }}"
          SHA=$(grep "${ARTIFACT}" SHA256SUMS | awk '{print $1}')
          jq -n \
            --argjson schema_version 1 \
            --arg repo "feastorg/CRUMBS" \
            --arg component "crumbs" \
            --arg version "${VERSION}" \
            --arg platform "linux-x86_64" \
            --arg asset "${ARTIFACT}" \
            --arg sha256 "${SHA}" \
            '{schema_version: $schema_version, repo: $repo, component: $component, version: $version, platform: $platform, asset: $asset, sha256: $sha256}' \
            > manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            crumbs-*.tar.gz
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
            manifest.json
          generate_release_notes: true

  # PyPI through Trusted Publishing, so no token is stored. The publisher on
  # pypi.org is registered for this repository, workflow `release.yml` and
  # environment `pypi`; the environment's reviewers gate the upload.
  publish-pypi:
    name: Publish crumbs-i2c to PyPI
    needs: release-linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/crumbs-i2c/${{ needs.release-linux-x86_64.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  # The published package, installed the way a consumer installs it: no
  # checkout, a fresh venv, the release pinned by version.
  verify-pypi:
    name: Install crumbs-i2c from PyPI
    needs: [release-linux-x86_64, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      VERSION: ${{ needs.release-linux-x86_64.outputs.version }}
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Install the released version into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/venv"
          # The index can lag the upload by a few minutes; keep asking.
          for attempt in $(seq 1 20); do
            if uv pip install --python "$RUNNER_TEMP/venv/bin/python" --no-cache \
                "crumbs-i2c==${VERSION}"; then
              exit 0
            fi
            echo "attempt ${attempt}: ${VERSION} is not installable yet; retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Import it, check its version and round-trip a frame
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import os
          from importlib.metadata import version

          from crumbs_i2c import Message, crc8, decode, encode

          assert version("crumbs-i2c") == os.environ["VERSION"], version("crumbs-i2c")
          assert crc8(b"123456789") == 0xF4
          message = Message(0x01, 0x80, b"\x2a")
          assert decode(encode(message)) == message
          print("crumbs-i2c", version("crumbs-i2c"), "OK")
          EOF
