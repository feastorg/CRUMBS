[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags = 
	-DCRUMBS_MAX_HANDLERS=8
	-I ..
lib_deps = 
	cameronbrooks11/CRUMBS@^0.17.0
	Servo

[env:nanoatmega328old]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600
monitor_speed = 115200
build_flags =
    -DCRUMBS_MAX_HANDLERS=8
    -I ..
lib_deps =
    cameronbrooks11/CRUMBS@^0.17.0
    Servo

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-DCRUMBS_MAX_HANDLERS=8
	-I ..
lib_deps =
	cameronbrooks11/CRUMBS@^0.17.0
	madhephaestus/ESP32Servo@^3.2.1

[platformio]
default_envs = nanoatmega328new
